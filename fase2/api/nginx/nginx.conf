worker_processes auto;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Resolver do Docker (127.0.0.11) permite ao nginx reconsultar o DNS
    # interno periodicamente. Como o serviço "api" resolve para o IP de
    # TODAS as réplicas ativas (incluindo as criadas dinamicamente pelo
    # autoscaler), o balanceamento acompanha a escala sem exigir reload
    # manual do nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8000;

        location / {
            set $upstream_api api:8000;
            proxy_pass http://$upstream_api;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Se uma réplica cair no meio da requisição, tenta a próxima
            # automaticamente antes de reportar erro ao cliente.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }
}
