[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "techchallenge-fase2"
version = "0.1.0"
description = "Otimizacao genetica do modelo de triagem de hipertensao da Fase 1"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.4,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

