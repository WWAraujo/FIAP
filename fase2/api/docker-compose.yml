networks:
  hipertensao_net:
    name: hipertensao_net
    driver: bridge

volumes:
  prometheus_sd_targets:
  prometheus_data:
  grafana_data:

services:
  # ----------------------------------------------------------------
  # API do modelo (escalável). deploy.replicas define a baseline fixa;
  # o serviço "autoscaler" cria/remove réplicas extras sob demanda,
  # sempre respeitando MIN_REPLICAS >= replicas aqui definidas.
  # ----------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: hipertensao-api:latest
    labels:
      - "hipertensao.role=api"
    environment:
      - LOG_LEVEL=INFO
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_MODEL=${GOOGLE_MODEL:-gemini-1.5-flash}
    networks:
      - hipertensao_net
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 384M
    restart: unless-stopped

  # ----------------------------------------------------------------
  # Load balancer / reverse proxy. Único ponto de entrada público da
  # API (porta 8000). Distribui requisições entre todas as réplicas
  # ativas de "api" via DNS interno do Docker.
  # ----------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - hipertensao_net
    restart: unless-stopped

  # ----------------------------------------------------------------
  # Autoscaling baseado em CPU + Service Discovery para o Prometheus.
  # Precisa do socket do Docker para criar/remover containers e ler
  # métricas de uso de recursos (equivalente a `docker stats`).
  # ----------------------------------------------------------------
  autoscaler:
    build: ./autoscaler
    environment:
      - API_IMAGE=hipertensao-api:latest
      - DOCKER_NETWORK_NAME=hipertensao_net
      - MIN_REPLICAS=2
      - MAX_REPLICAS=6
      - CPU_SCALE_UP_THRESHOLD=70
      - CPU_SCALE_DOWN_THRESHOLD=25
      - POLL_INTERVAL_SECONDS=15
      - COOLDOWN_SECONDS=60
      - APP_PORT=8000
      - METRICS_PORT=9200
      - TARGETS_FILE=/targets/api-targets.json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - prometheus_sd_targets:/targets
    ports:
      - "9200:9200"
    networks:
      - hipertensao_net
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------------------------------
  # Monitoramento
  # ----------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_sd_targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - hipertensao_net
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      # Mount do arquivo do socket diretamente (não do diretório /var/run):
      # em Docker Desktop, só o bind-mount direto de /var/run/docker.sock é
      # encaminhado para o daemon real; montar o diretório inteiro deixa o
      # cAdvisor sem conseguir resolver nomes/labels dos containers.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"
    networks:
      - hipertensao_net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - hipertensao_net
    restart: unless-stopped
